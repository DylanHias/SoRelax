name = "sorelax-contact"
main = "src/index.ts"
compatibility_date = "2025-04-01"

# Non-secret vars. Override per-environment with `wrangler.<env>.toml` or the
# dashboard. `CONTACT_FORM_FROM` must be an address on a Resend-verified domain.
[vars]
CONTACT_FORM_TO = "info@sorelaxmassage.be"
CONTACT_FORM_FROM = "So'Relax <no-reply@sorelaxmassage.be>"
ALLOWED_ORIGIN = "https://sorelaxmassage.be,https://sorelaxmassage.pages.dev"

# Secrets (set via `wrangler secret put`):
#   RESEND_API_KEY

# Minimal observability. Tune as needed.
[observability]
enabled = true
